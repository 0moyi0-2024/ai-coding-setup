<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:0.85"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.06" fill="#ffffff">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/>
    <circle cx="50" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="150" cy="100" r="2"/>
    <circle cx="50" cy="150" r="2"/><circle cx="100" cy="150" r="2"/><circle cx="150" cy="150" r="2"/>
    <circle cx="1050" cy="525" r="2"/><circle cx="1100" cy="525" r="2"/><circle cx="1150" cy="525" r="2"/>
    <circle cx="1050" cy="575" r="2"/><circle cx="1100" cy="575" r="2"/><circle cx="1150" cy="575" r="2"/>
    <circle cx="1050" cy="625" r="2"/><circle cx="1100" cy="625" r="2"/><circle cx="1150" cy="625" r="2"/>
  </g>

  <!-- Decorative lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Connection lines between layers -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8,4">
    <line x1="600" y1="200" x2="600" y2="230"/>
    <line x1="600" y1="340" x2="600" y2="370"/>
    <line x1="600" y1="480" x2="600" y2="510"/>
    <path d="M300,290 Q300,290 300,290 L300,290" fill="none"/>
    <!-- Arrows -->
    <polygon points="600,225 593,215 607,215" fill="#ffffff" fill-opacity="0.2"/>
    <polygon points="600,365 593,355 607,355" fill="#ffffff" fill-opacity="0.2"/>
    <polygon points="600,505 593,495 607,495" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- Layer cards -->
  <!-- Layer 1: C++ Serving -->
  <g filter="url(#shadow)">
    <rect x="150" y="120" width="900" height="80" rx="12" fill="url(#card1)"/>
    <text x="600" y="158" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">C++ Serving Framework</text>
    <text x="600" y="185" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="monospace" font-size="13">Scheduler → Engine → Worker → KV Cache → Sampling</text>
  </g>

  <!-- Layer 2: Python Model -->
  <g filter="url(#shadow)">
    <rect x="200" y="260" width="800" height="80" rx="12" fill="url(#card3)"/>
    <text x="600" y="298" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">Python Model Layer</text>
    <text x="600" y="325" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="monospace" font-size="13">nn.Module → load_weights() → ModelExecutor.forward()</text>
  </g>

  <!-- Layer 3: Kernel -->
  <g filter="url(#shadow)">
    <rect x="250" y="400" width="700" height="80" rx="12" fill="url(#card2)"/>
    <text x="600" y="438" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">Kernel / Hardware Layer</text>
    <text x="600" y="465" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="monospace" font-size="13">TORCH_LIBRARY → AscendC / ACLNN → torch.ops.xllm_ops</text>
  </g>

  <!-- Small tag: PR 37 -->
  <g filter="url(#glow)">
    <rect x="460" y="530" width="280" height="44" rx="22" fill="#ff6b6b" fill-opacity="0.9"/>
    <text x="600" y="559" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600">DeepSeek V4 · PR #37</text>
  </g>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="800" filter="url(#glow)">
    xLLM 框架走读
  </text>

  <!-- Subtitle -->
  <text x="600" y="100" text-anchor="middle" fill="#a0a0c0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">
    从一个 PR 看懂 C++ 性能 × Python 灵活性的推理架构
  </text>

  <!-- Bottom label -->
  <text x="600" y="625" text-anchor="middle" fill="#606080" font-family="monospace" font-size="12">
    xllm · Ascend NPU · DeepSeek V4 · DSA · Hash-MoE
  </text>

  <!-- Decorative corner brackets -->
  <g stroke="#667eea" stroke-width="2" fill="none" opacity="0.4">
    <path d="M30,30 L30,80 L80,80"/>
    <path d="M1170,30 L1170,80 L1120,80"/>
    <path d="M30,645 L30,595 L80,595"/>
    <path d="M1170,645 L1170,595 L1120,595"/>
  </g>

  <!-- Small code-like decorations -->
  <g fill="#4facfe" fill-opacity="0.3" font-family="monospace" font-size="11">
    <text x="40" y="610">TORCH_LIBRARY(xllm_ops, m)</text>
    <text x="950" y="65">kernels_npu.compressor()</text>
  </g>
</svg>