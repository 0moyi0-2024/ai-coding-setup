<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="whale" x1="20%" y1="10%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g transform="translate(128,112)">
    <!-- 喷水 - 科技蓝光点 -->
    <g>
      <circle cx="-2" cy="-62" r="2.5" fill="#38bdf8" filter="url(#glow)" opacity="0.95"/>
      <circle cx="-9" cy="-68" r="1.6" fill="#7dd3fc" opacity="0.8"/>
      <circle cx="6" cy="-70" r="1.3" fill="#7dd3fc" opacity="0.7"/>
      <path d="M-2 -54 C-4 -58 -7 -64 -9 -67" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M2 -54 C4 -60 6 -66 6 -69" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.5"/>
    </g>

    <!-- 鲸鱼身体 -->
    <path d="
      M -82 10
      C -78 -18, -50 -52, -6 -54
      C 26 -54, 54 -44, 72 -26
      C 84 -12, 86 6, 70 20
      C 50 34, 16 36, -16 32
      C -44 28, -72 18, -82 10 Z"
      fill="url(#whale)"/>

    <!-- 腹部高光 -->
    <path d="
      M -66 14
      C -42 24, -4 28, 34 18
      C 24 26, -4 30, -32 26
      C -50 22, -60 18, -66 14 Z"
      fill="#e2e8f0" opacity="0.3"/>

    <!-- 背鳍 -->
    <path d="M 6 -52 C 16 -68, 30 -70, 30 -52 C 26 -42, 16 -38, 6 -42 Z"
          fill="#0f172a"/>

    <!-- 胸鳍 -->
    <path d="M -10 14 C -22 26, -38 40, -26 44 C -12 42, 2 26, 14 14 Z"
          fill="#020617"/>

    <!-- 尾鳍 -->
    <path d="M -82 10 C -96 0, -110 -12, -118 -24 L -100 -6"
          stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M -84 12 C -98 22, -114 30, -120 40 L -102 20"
          stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- 眼睛（发光蓝） -->
    <circle cx="44" cy="-28" r="9" fill="#38bdf8" opacity="0.12"/>
    <circle cx="44" cy="-28" r="5.5" fill="url(#eye)"/>
    <circle cx="46" cy="-30" r="2" fill="#f0f9ff"/>

    <!-- 科技小点缀 -->
    <circle cx="64" cy="-12" r="1.5" fill="#38bdf8" opacity="0.7"/>
    <path d="M64 -12 L76 -16" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <circle cx="68" cy="-4" r="1" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- DSH 文字 - 灵魂所在 -->
  <text x="128" y="238" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="700" fill="#0f172a" letter-spacing="7">DSH</text>
</svg>