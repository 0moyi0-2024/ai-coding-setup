name: Build Windows Installer

# =============================================================================
#  自动编译 DSH Windows 安装包
#  - 推送代码 → 自动构建验证（上传到 Artifacts）
#  - 发布 Release → 自动构建并附加安装包到 Release
#  - 手动触发 → 随时构建
# =============================================================================

on:
  push:
    branches: [main, master]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows-installer.yml'
  workflow_dispatch:
  release:
    types: [published]

# release 事件需要写权限来上传附件
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh  # 强制使用 PowerShell 7

    steps:
      # =================================================================
      # Step 1: 拉取代码
      # =================================================================
      - name: Checkout 仓库
        uses: actions/checkout@v4

      # =================================================================
      # Step 2: 安装 Inno Setup（用 chocolatey）
      # =================================================================
      - name: 安装 Inno Setup
        run: |
          choco install innosetup -y --no-progress --limit-output
          # 刷新 PATH，让 ISCC.exe 在后续脚本中可被直接调用
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "Inno Setup 安装完成"
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            Write-Host "  iscc 已在 PATH 中"
          } else {
            Write-Host "  ⚠️ iscc 不在 PATH，搜索路径..."
            $p = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              Write-Host "  找到: $p"
              $env:Path += ";$($p.DirectoryName)"
              $p.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
            else { Write-Host "  ❌ 未找到 ISCC.exe" }
          }

      # =================================================================
      # Step 3: 安装 PS2EXE 模块（build.ps1 也会装，但提前装好更可靠）
      # =================================================================
      - name: 安装 PS2EXE 模块
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module -Name ps2exe -Force -AllowClobber -Scope CurrentUser -Repository PSGallery
          Import-Module ps2exe -Force
          $m = Get-Module ps2exe | Select-Object -First 1
          Write-Host "PS2EXE 模块安装完成: $($m.Name) $($m.Version)"

      # =================================================================
      # Step 4: Release 使用标签作为安装包版本
      # =================================================================
      - name: 设置 Release 构建版本
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Release 标签必须是语义版本，例如 v0.1.0-rc.9；当前值: $($env:RELEASE_TAG)"
          }
          "DSH_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release 构建版本: $version"

      # =================================================================
      # Step 5: 运行构建
      # =================================================================
      - name: 构建 DSH Windows 安装包
        working-directory: windows/installer
        run: ./build.ps1

      # =================================================================
      # Step 6: 验证输出文件
      # =================================================================
      - name: 列出构建产物
        working-directory: windows/installer
        run: |
          Write-Host "========== 构建产物 =========="
          Get-ChildItem *.exe | ForEach-Object {
            $sizeKB = [math]::Round($_.Length / 1KB, 1)
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            $label = if ($sizeMB -ge 1) { "$sizeMB MB" } else { "$sizeKB KB" }
            Write-Host "  📄 $($_.Name)  ($label)" -ForegroundColor Green
          }
          Write-Host "=============================="

      # =================================================================
      # Step 7: 上传构建产物（每次 push 都保留）
      # =================================================================
      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Windows-Installer
          # 保留 30 天（默认 90 天，节省空间）
          retention-days: 30
          path: |
            windows/installer/DSH-一键安装-*.exe
            windows/installer/DSH-一键安装.exe
            windows/installer/DSH-Tray.exe
            windows/installer/清理DSH.exe

      # =================================================================
      # Step 8: 发布 Release 时自动附加安装包
      # =================================================================
      - name: 上传到 GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/installer/DSH-一键安装-*.exe
            windows/installer/DSH-一键安装.exe
            windows/installer/DSH-Tray.exe
            windows/installer/清理DSH.exe
